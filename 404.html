<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Isomers by Neeraj the Beloved</title>
  <style>
    /* Self-contained so it looks right at any address. */
    :root { --bg: #fff; --text: #1b1e23; --muted: #5f6672; --accent: #c62828; --accent-ink: #fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171b; --text: #e7e9ed; --muted: #a3a9b4; --accent: #ff7070; --accent-ink: #1f0b0b; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    main { max-width: 28rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
    p { color: var(--muted); font-size: 1.05rem; line-height: 1.5; margin: 0 0 1.4rem; }
    a { display: inline-block; padding: 0.6rem 1rem; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404: this page has no isomers.</h1>
    <p>It doesn’t even exist. The Great Neeraj checked behind the mirror too.</p>
    <a id="home-link" href="./">Go to the home page</a>
  </main>
  <script>
    // On GitHub Pages the home page lives at /<repo-name>/, so link there.
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      if (/\.github\.io$/.test(location.hostname) && parts.length > 0) {
        document.getElementById('home-link').href = '/' + parts[0] + '/';
      }
    })();
  </script>
</body>
</html>
